name: Check skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SKILL.md frontmatter and plugin.json validate
        shell: bash
        run: |
          npm install --no-save --no-package-lock yaml@2.6.1
          node tests/frontmatter.mjs
      - name: Text files are clean UTF-8 (no double encoding)
        run: node tests/text-encoding.mjs
      - name: Windows and cross-platform compatibility tests pass
        run: node --test tests/win-compat.mjs
      - name: Scripts parse
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs"), path = require("node:path"), { execFileSync } = require("node:child_process");
            const walk = d => fs.readdirSync(d, { withFileTypes: true }).flatMap(e => {
              const p = path.join(d, e.name);
              return e.isDirectory() ? walk(p) : /\.(mjs|js)$/i.test(e.name) ? [p] : [];
            });
            for (const f of [...walk("skills/taste-skill/scripts"), ...walk("skills/taste-skill/assets"), ...walk("tests")]) {
              execFileSync(process.execPath, ["--check", f], { stdio: "inherit" });
            }
          '
